server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo estático sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash (JS, CSS)
    location ~* \.(js|css|woff2?|ico|png|svg|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
