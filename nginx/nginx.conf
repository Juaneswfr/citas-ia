upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;

    # Resolver DNS interno de Docker — re-resuelve nombres de servicios dinámicamente
    resolver 127.0.0.11 valid=30s ipv6=off;
    server_name hilo.esjuanez.com;

    # Payload máximo (webhooks de Meta pueden traer archivos)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/hilo.access.log;
    error_log  /var/log/nginx/hilo.error.log;

    # ── API REST — quita el prefijo /api antes de pasar al backend ────────────
    location /api/ {
        proxy_pass         http://backend/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── Webhooks Meta/WhatsApp y Google Calendar ──────────────────────────────
    location /webhooks/ {
        proxy_pass         http://backend/webhooks/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── OAuth Google — callback directo sin prefijo /api ─────────────────────
    location /auth/google/callback {
        proxy_pass         http://backend/auth/google/callback;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Frontend SSR (todo lo demás) ──────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # WebSocket (hot reload en dev, no daña en prod)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
