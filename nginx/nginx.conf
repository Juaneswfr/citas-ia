server {
    listen 80;

    # Resolver DNS interno de Docker. Los destinos van en variables para que nginx
    # resuelva `frontend` y `backend` en cada petición (con caché de 10 s) y no solo
    # al arrancar: si un contenedor se reinicia y cambia de IP, nginx lo sigue solo.
    # Con bloques `upstream` la IP quedaba fija y había que reiniciar nginx (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:3000;
    set $backend_upstream  backend:8000;

    # hilo.esjuanez.com queda como alias temporal mientras se migran Google, Meta y Kapso a zumit.app.
    server_name zumit.app www.zumit.app hilo.esjuanez.com;

    # Payload máximo (webhooks de Meta pueden traer archivos)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/hilo.access.log;
    error_log  /var/log/nginx/hilo.error.log;

    # ── Zumit Manager (panel de la plataforma) ────────────────────────────────
    # Nunca indexable ni cacheable. Va aquí y también en front/src/server.ts. No se lista en robots.txt a propósito:
    # ese archivo es público y publicaría la ruta. Un `location` con `add_header` propio no hereda los del server.
    location /api/zmanager/ {
        add_header         X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header         Cache-Control "no-store" always;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /zmanager {
        add_header         X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header         Cache-Control "no-store" always;
        add_header         Referrer-Policy "no-referrer" always;
        proxy_pass         http://$frontend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ── API REST — quita el prefijo /api antes de pasar al backend ────────────
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # ── Webhooks Meta/WhatsApp y Google Calendar ──────────────────────────────
    location /webhooks/ {
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── OAuth Google — callback directo sin prefijo /api ─────────────────────
    location /auth/google/callback {
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── OAuth Facebook — callback directo sin prefijo /api ───────────────────
    location /auth/facebook/callback {
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # ── Frontend SSR (todo lo demás) ──────────────────────────────────────────
    location / {
        proxy_pass         http://$frontend_upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # WebSocket (hot reload en dev, no daña en prod)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
