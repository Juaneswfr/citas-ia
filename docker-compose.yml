services:

  # ── Frontend: SSR Nitro (build dentro del container) ──────────────────────────
  # Actualizar: git pull + docker compose up --build frontend
  # Rebuild si cambia package-lock.json o código fuente
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./front/.env
    environment:
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
    networks:
      - app

  # ── Backend: FastAPI ──────────────────────────────────────────────────────────
  # Actualizar código: git pull + docker compose restart backend
  # Rebuild solo si cambia pyproject.toml (nuevas dependencias)
  backend:
    build:
      context: ./backend-lang
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-lang/.env
    volumes:
      - ./backend-lang/src:/app/src:ro
      - ./backend-lang/.env:/app/.env:ro
    networks:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx: router interno (Apache ya maneja SSL externamente) ─────────────────
  # Apache en el host hace proxy a 127.0.0.1:7000 → este nginx
  # Este nginx enruta al frontend y backend dentro de la red Docker
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
