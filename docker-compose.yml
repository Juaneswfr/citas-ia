services:

  # ── Frontend: SPA estática servida por nginx ─────────────────────────────────
  # Workflow: npm run build local → subir dist/client/ por FTP a front-app/dist/client/
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./front-app/dist/client:/usr/share/nginx/html:ro
      - ./nginx/spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app

  # ── Backend: FastAPI ──────────────────────────────────────────────────────────
  # Actualizar código: git pull + docker compose restart backend
  # Rebuild solo si cambia pyproject.toml (nuevas dependencias)
  backend:
    build:
      context: ./backend-lang
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-lang/.env
    volumes:
      - ./backend-lang/src:/app/src:ro
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx: router interno (Apache ya maneja SSL externamente) ─────────────────
  # Apache en el host hace proxy a 127.0.0.1:7000 → este nginx
  # Este nginx enruta al frontend y backend dentro de la red Docker
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
