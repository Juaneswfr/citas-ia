services:

  # ── Frontend: TanStack Start SSR ─────────────────────────────────────────────
  frontend:
    build:
      context: ./front-app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_URL=https://hilo.esjuanez.com/api
    networks:
      - app

  # ── Backend: FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-lang
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-lang/.env
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx: router interno (Apache ya maneja SSL externamente) ─────────────────
  # Apache en el host hace proxy a 127.0.0.1:7000 → este nginx
  # Este nginx enruta al frontend y backend dentro de la red Docker
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app

networks:
  app:
    driver: bridge
